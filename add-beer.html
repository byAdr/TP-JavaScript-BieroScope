<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="stylesheet" href="./style.css" />
    <script src="./stockage.js"></script>
    <title>Ajouter une bière locale | BieroScope</title>
  </head>
  <body>
    <main>
      <nav><a href="./">Retour au catalogue</a></nav>
      <h1>Ajouter une bière locale</h1>
      <form>
        <label for="name">Nom</label>
        <input id="name" name="name" required pattern=".*\S.*" />
        <label for="tagline">Slogan</label>
        <input id="tagline" name="tagline" />
        <label for="description">Description</label>
        <input id="description" name="description" />
        <button type="submit">Enregistrer</button>
      </form>
      <p id="statut" role="status"></p>
    </main>
    <script>
      const formulaire = document.querySelector("form");
      const bouton = formulaire.querySelector("button");
      formulaire.addEventListener("submit", async (event) => {
        event.preventDefault();
        if (bouton.disabled) return;
        bouton.disabled = true;
        const valeurs = new FormData(formulaire);
        try {
          await ajouterBiereLocale({
            name: valeurs.get("name").trim(),
            tagline: valeurs.get("tagline").trim(),
            description: valeurs.get("description").trim(),
          });
          location.replace("./");
        } catch (erreur) {
          document.querySelector("#statut").textContent = "Impossible d’enregistrer la bière sur cet appareil.";
          console.error(erreur);
          bouton.disabled = false;
        }
      });
    </script>
  </body>
</html>
