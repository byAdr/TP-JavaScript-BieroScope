<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BieroScope</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="stylesheet" href="style.css" />
    <script src="stockage.js"></script>
    <script src="app.js"></script>
    <link rel="sw" href="./sw.js" />
  </head>
  <body>
    <main>
      <header>
        <p>Catalogue documentaire</p>
        <h1>BieroScope</h1>
        <p>Explorez les fiches du catalogue Punk API.</p>
      </header>
      <form id="recherche-form">
        <label for="nom">Nom à rechercher</label>
        <input id="nom" name="nom" placeholder="Ex. : punk" />
        <button type="submit">Rechercher</button>
      </form>
      <nav aria-label="Actions du catalogue">
        <button id="charger" type="button">Charger le catalogue</button>
        <button id="aleatoire" type="button">Fiche au hasard</button>
        <a class="ajouter-biere" href="./add-beer.html"><span aria-hidden="true">🍺</span> Ajouter une bière</a>
        <button id="install" type="button" hidden>Installer BieroScope</button>
      </nav>
      <p id="statut" role="status" aria-live="polite"></p>
      <section id="catalogue" aria-label="Fiches du catalogue"></section>
      <nav id="pagination" aria-label="Pages du catalogue" hidden>
        <button id="page-precedente" type="button">Page précédente</button>
        <span id="numero-page"></span>
        <button id="page-suivante" type="button">Page suivante</button>
      </nav>
    </main>
  </body>
</html>
